<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Reportes de Degustación - Tinto Banquetería</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#2a2a2a;color:#222;padding:2rem;font-family:'Quicksand',sans-serif;min-height:100vh}
    .form-container{max-width:1000px;margin:0 auto;background:#c7c7c7;border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
    .logo-container{text-align:center;margin-bottom:0;background:#2a2a2a;padding:20px}
    .logo-container img{max-width:200px;height:auto}
    .form-header{background:#2a2a2a;padding:40px 30px;text-align:center;color:white}
    .form-header h1{font-family:'Cinzel',serif;font-size:35px;margin-bottom:1rem;font-weight:bold;text-transform:uppercase}
    .form-header p{font-family:'Cinzel',serif;font-size:20px}
    .form-content{padding:40px 50px;background:#c7c7c7}
    .section{margin-bottom:40px;padding:30px;border-radius:15px;background:#f8f9fa}
    .controls{display:flex;gap:15px;margin-bottom:20px;padding:0;flex-wrap:wrap;align-items:center}
    .submit-btn{background:#2a2a2a;color:white;border:none;padding:15px 40px;border-radius:50px;font-size:1.1em;font-weight:600;font-family:'Cinzel',serif;cursor:pointer;transition:all .3s ease;box-shadow:0 8px 20px rgba(42,42,42,.3)}
    .submit-btn:hover{background:#1a1a1a;transform:translateY(-3px);box-shadow:0 12px 30px rgba(42,42,42,.4)}
    .submit-btn:disabled{background:#999;cursor:not-allowed;transform:none;box-shadow:none}
    .btn-secondary{background:#e5e5e5;color:#222;border:none;padding:12px 25px;border-radius:30px;font-size:16px;font-weight:600;font-family:'Cinzel',serif;cursor:pointer;transition:all .3s ease}
    .btn-secondary:hover{background:#d5d5d5;transform:translateY(-2px)}
    .select{padding:12px 16px;border:2px solid #e0e0e0;border-radius:10px;font-size:1em;background:#fff;color:#333;font-family:'Quicksand',sans-serif;min-width:200px}
    .reports-list{display:grid;gap:25px;margin-bottom:30px;padding:0}
    .report-card{background:#f8f9fa;border-radius:15px;padding:30px;margin:0;transition:all 0.3s ease;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
    .report-card:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,0,0,0.15)}
    .report-header{margin-bottom:20px;padding:0}
    .report-title{font-family:'Cinzel',serif;font-size:24px;color:#2a2a2a;font-weight:bold;text-transform:uppercase;margin-bottom:8px}
    .report-subtitle{font-family:'Cinzel',serif;font-size:18px;color:#666;margin-bottom:20px}
    .participants-section{display:flex;justify-content:space-between;align-items:center;margin-top:15px}
    .participants-info{flex:1}
    .participants-label{font-size:14px;color:#666;font-weight:600;margin-bottom:5px}
    .participants-count{font-size:24px;font-weight:bold;color:#2a2a2a;font-family:'Cinzel',serif}
    .detailed-report{margin-top:30px;display:none}
    .report-document{background:white;padding:40px;border-radius:15px;box-shadow:0 5px 15px rgba(0,0,0,0.1);font-family:'Quicksand',sans-serif;line-height:1.4}
    .report-document h1{font-family:'Cinzel',serif;color:#2a2a2a;font-size:28px;margin-bottom:10px;text-align:left}
    .report-document h2{font-family:'Cinzel',serif;color:#2a2a2a;font-size:22px;margin-bottom:20px;margin-top:30px}
    .report-document h3{color:#2a2a2a;font-size:18px;margin-bottom:15px;margin-top:25px;font-weight:bold}
    .cocktail-icon{font-size:20px;margin-right:8px}
    .item-list{margin:0;padding:0;list-style:none}
    .item-list li{margin:8px 0;font-size:16px;color:#333;padding-left:20px;position:relative}
    .item-list li:before{content:"•";color:#2a2a2a;font-weight:bold;position:absolute;left:0}
    .vote-count{font-weight:normal;color:#2a2a2a}
    .comments-section{background:#f8f9fa;padding:20px;border-radius:10px;margin-top:20px;border:1px solid #e5e5e5}
    .comment-item{margin:10px 0;padding:10px;background:white;border-radius:8px;border:1px solid #e5e5e5}
    .comments-section.simple{border:none}
    .comments-section.simple .comment-item{border:1px solid #e5e5e5}
    .comment-author{font-weight:bold;color:#2a2a2a;margin-bottom:5px}
    .comment-text{color:#555;font-style:italic}
    .empty-state{text-align:center;padding:60px;color:#666;background:#f8f9fa;border-radius:15px}
    .empty-state h3{margin-bottom:15px;color:#2a2a2a;font-family:'Cinzel',serif;font-size:24px;text-transform:uppercase}
    /* Tabs */
    .tab-bar{display:flex;gap:0;margin-bottom:20px;border-bottom:3px solid #2a2a2a;overflow-x:auto}
    .tab-btn{background:transparent;border:none;padding:12px 24px;font-family:'Cinzel',serif;font-size:15px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;transition:all .3s;white-space:nowrap}
    .tab-btn:hover{color:#2a2a2a}
    .tab-btn.active{color:#2a2a2a;border-bottom-color:#2a2a2a}
    .tab-content{display:none}
    .tab-content.active{display:block}

    /* Fondos table */
    .fondos-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-bottom:20px}
    .fondos-table th{background:#2a2a2a;color:#fff;font-family:'Cinzel',serif;font-size:13px;text-transform:uppercase;padding:12px 14px;text-align:left;font-weight:600}
    .fondos-table td{padding:10px 14px;font-size:14px;border-bottom:1px solid #eee;vertical-align:top}
    .fondos-table tr:last-child td{border-bottom:none}
    .fondos-table tr:hover td{background:#f8f8f0}
    .fondos-evento{font-weight:700;color:#2a2a2a;font-family:'Cinzel',serif;font-size:13px}
    .fondos-plato{font-size:13px;line-height:1.5}
    .fondos-plato .prot{font-weight:600;color:#333}
    .fondos-plato .acomp{color:#666;font-style:italic}
    .fondos-plato .sep{color:#bbb;margin:0 4px}

    /* Badges */
    .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin:2px 3px 2px 0;line-height:1.4}
    .badge-error{background:#fde8e8;color:#c0392b;border:1px solid #e6b0aa}
    .badge-warning{background:#fef9e7;color:#b7950b;border:1px solid #f9e79f}
    .badge-cambio{background:#fff8e1;color:#e67e22;border:1px solid #f5cba7}
    .badge-ok{background:#eafaf1;color:#1e8449;border:1px solid #abebc6}
    .badge-submissions{background:#eaf2f8;color:#2471a3;border:1px solid #aed6f1;font-size:10px}

    /* Fondos comment (in-table cell) */
    .fondos-comment-cell{font-size:12px;color:#555;font-style:italic;line-height:1.5;display:block;max-width:220px;overflow-wrap:break-word}

    /* Fondos stats bar */
    .fondos-stats{display:flex;gap:20px;margin-bottom:20px;flex-wrap:wrap}
    .fondos-stat{background:#f8f9fa;border-radius:10px;padding:15px 20px;flex:1;min-width:130px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .fondos-stat-num{font-family:'Cinzel',serif;font-size:28px;font-weight:700;color:#2a2a2a}
    .fondos-stat-label{font-size:12px;color:#888;font-weight:600;margin-top:4px}

    @media (max-width:768px){
      .form-content{padding:20px 25px}
      .report-document{padding:20px}
      .controls{flex-direction:column;align-items:stretch}
      .participants-section{flex-direction:column;align-items:flex-start;gap:15px}
      .fondos-table{font-size:12px}
      .fondos-table th,.fondos-table td{padding:8px 8px}
      .tab-btn{padding:10px 14px;font-size:13px}
      .fondos-stats{gap:10px}
      .fondos-stat{min-width:100px;padding:10px 12px}
    }
    .modal-overlay-custom{
      display:none;position:fixed;top:0;left:0;right:0;bottom:0;
      background:rgba(42,42,42,0.95);backdrop-filter:blur(5px);z-index:9999;
      justify-content:center;align-items:center;padding:20px;
    }
    .modal-content-custom{
      background:#c7c7c7;border-radius:20px;padding:40px;max-width:500px;width:100%;
      box-shadow:0 30px 80px rgba(0,0,0,.5);text-align:center;
    }
    .modal-icon{font-size:60px;margin-bottom:20px;}
    .modal-title-custom{font-family:'Cinzel',serif;font-size:24px;color:#2a2a2a;margin-bottom:15px;font-weight:bold;text-transform:uppercase;}
    .modal-message-custom{font-size:16px;color:#555;line-height:1.6;margin-bottom:30px;}
    .modal-buttons{display:flex;gap:15px;justify-content:center;flex-wrap:wrap;}
    .modal-btn{border:none;border-radius:30px;padding:12px 30px;font-weight:700;cursor:pointer;font-family:'Cinzel',serif;font-size:16px;transition:all .3s ease;}
    .modal-btn-primary{background:#2a2a2a;color:#fff;box-shadow:0 8px 20px rgba(42,42,42,.25);}
    .modal-btn-primary:hover{background:#1a1a1a;transform:translateY(-2px);}
    .modal-btn-secondary{background:#e5e5e5;color:#222;}
    .modal-btn-secondary:hover{background:#d5d5d5;transform:translateY(-2px);}
  </style>
</head>
<body>
  <!-- Modal personalizado -->
  <div id="modalCustom" class="modal-overlay-custom">
    <div class="modal-content-custom">
      <div id="modalIcon" class="modal-icon"></div>
      <h2 id="modalTitle" class="modal-title-custom"></h2>
      <p id="modalMessage" class="modal-message-custom"></p>
      <div id="modalButtons" class="modal-buttons"></div>
    </div>
  </div>

  <div class="form-container">
    <div class="logo-container">
      <img src="https://res.cloudinary.com/drqkiohu8/image/upload/v1750254786/LogoanimadoTinto_blanco-ezgif.com-optimize_uf4ruz.gif" alt="Logo Tinto Banqueteria">
    </div>

    <div class="form-header">
      <h1>Reportes de Degustacion</h1>
      <p>Informe consolidado de resultados por fecha</p>
    </div>

    <div class="form-content">
      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('reportes')">📊 Reportes</button>
        <button class="tab-btn" onclick="switchTab('fondos')">🍽️ Revision de Fondos</button>
      </div>

      <!-- TAB 1: Reportes -->
      <div id="tabReportes" class="tab-content active">
        <div class="controls">
          <button class="btn-secondary" id="backButton" onclick="goBack()" style="display:none;">← Atras</button>
          <select class="select" id="reportFilter" onchange="filterReports()"></select>
          <button class="btn-secondary" id="generarAhoraBtn" onclick="generarAhora()" style="background:#2a2a2a;color:white;">⚡ Generar Reporte Ahora</button>
        </div>

        <div id="reportsList" class="reports-list">
          <div class="empty-state">
            <h3>No hay reportes disponibles</h3>
            <p>Los reportes apareceran aqui cuando se generen degustaciones</p>
          </div>
        </div>

        <div id="detailedReport" class="detailed-report"></div>
      </div>

      <!-- TAB 2: Revision de Fondos -->
      <div id="tabFondos" class="tab-content">
        <div class="controls">
          <button class="btn-secondary" id="refreshFondosBtn" onclick="cargarFondos()" style="background:#2a2a2a;color:white;">🔄 Actualizar</button>
        </div>
        <div id="fondosStats" class="fondos-stats" style="display:none;"></div>
        <div id="fondosContainer">
          <div class="empty-state">
            <h3>🍽️ Revision de Fondos</h3>
            <p>Cargando datos de platos de fondo...</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
